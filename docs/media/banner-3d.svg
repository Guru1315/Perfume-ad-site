<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="ÉCORCE — Maison de Parfum. Animated 3D banner: a glass bottle turns over a rotating star seal while scent mist rises. Live at perfume-ad-site.vercel.app">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#7a2226"/>
      <stop offset="0.55" stop-color="#4a1618"/>
      <stop offset="1" stop-color="#1d0b0c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d79c"/>
      <stop offset="0.5" stop-color="#c9a04e"/>
      <stop offset="1" stop-color="#8f6a26"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a3a"/>
      <stop offset="0.6" stop-color="#d35f1f"/>
      <stop offset="1" stop-color="#9e3c12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="wood" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#d9a873"/>
      <stop offset="0.5" stop-color="#9a6438"/>
      <stop offset="1" stop-color="#5a3216"/>
    </radialGradient>
    <radialGradient id="puff" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3e6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fbe7d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbe7d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <path id="ring" d="M640,232 m-205,0 a205,205 0 1,1 410,0 a205,205 0 1,1 -410,0"/>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- star seal, slowly turning (the home page's seal) -->
  <g transform="translate(0,150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 640 640" to="360 640 640" dur="60s" repeatCount="indefinite"/>
      <polygon fill="#5a1c1c" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.6"
        points="640.0,210.0 736.3,280.7 855.0,267.6 903.0,377.0 1012.4,425.0 999.3,543.7 1070.0,640.0 999.3,736.3 1012.4,855.0 903.0,903.0 855.0,1012.4 736.3,999.3 640.0,1070.0 543.7,999.3 425.0,1012.4 377.0,903.0 267.6,855.0 280.7,736.3 210.0,640.0 280.7,543.7 267.6,425.0 377.0,377.0 425.0,267.6 543.7,280.7"/>
      <polygon fill="none" stroke="#c9a04e" stroke-opacity="0.45" stroke-width="1.2" points="640.0,232.0 731.1,300.0 844.0,286.7 888.9,391.1 993.3,436.0 980.0,548.9 1048.0,640.0 980.0,731.1 993.3,844.0 888.9,888.9 844.0,993.3 731.1,980.0 640.0,1048.0 548.9,980.0 436.0,993.3 391.1,888.9 286.7,844.0 300.0,731.1 232.0,640.0 300.0,548.9 286.7,436.0 391.1,391.1 436.0,286.7 548.9,300.0"/>
      <circle cx="640" cy="640" r="330" fill="none" stroke="#c9a04e" stroke-opacity="0.35" stroke-dasharray="2 10"/>
    </g>
  </g>

  <!-- manifesto ring, counter-rotating -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="rotate" from="0 640 232" to="-360 640 232" dur="80s" repeatCount="indefinite"/>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="5" fill="#c9a04e">
      <textPath xlink:href="#ring" href="#ring" textLength="1270" lengthAdjust="spacing">WE GATHER · WE MACERATE · WE WAIT · WE REMEMBER · WE DISTIL · </textPath>
    </text>
  </g>

  <!-- note words flying out of depth (the "Into the scent" tunnel) -->
  <g font-family="Impact, 'Arial Narrow', 'Helvetica Neue', sans-serif" font-weight="700" fill="#e9c98c">
    <g transform="translate(820,200)">
      <text text-anchor="middle" font-size="30" transform="skewX(-12)" opacity="0">LEATHER
        <animate attributeName="opacity" values="0;0.55;0" dur="6s" repeatCount="indefinite"/>
      </text>
      <animateTransform attributeName="transform" type="scale" values="0.35;1.7" dur="6s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(470,130)">
      <text text-anchor="middle" font-size="26" transform="skewX(-12)" opacity="0">BIRCH
        <animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      </text>
      <animateTransform attributeName="transform" type="scale" values="0.35;1.6" dur="6s" begin="2s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(800,330)">
      <text text-anchor="middle" font-size="24" transform="skewX(-12)" opacity="0">BLACK TEA
        <animate attributeName="opacity" values="0;0.45;0" dur="6s" begin="4s" repeatCount="indefinite"/>
      </text>
      <animateTransform attributeName="transform" type="scale" values="0.35;1.5" dur="6s" begin="4s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- the bottle: faux-3D turn (body narrows and widens, the label slides round, highlights sweep) -->
  <g filter="url(#shadow)">
    <!-- cap: turned walnut sphere -->
    <g>
      <circle cx="640" cy="112" r="44" fill="url(#wood)"/>
      <g stroke="#4a2410" stroke-opacity="0.35" fill="none" stroke-width="1.4">
        <path d="M600,104 Q640,96 680,104"><animate attributeName="d" values="M600,104 Q640,96 680,104;M604,108 Q640,118 676,108;M600,104 Q640,96 680,104" dur="6s" repeatCount="indefinite"/></path>
        <path d="M598,120 Q640,112 682,120"><animate attributeName="d" values="M598,120 Q640,112 682,120;M600,126 Q640,134 680,126;M598,120 Q640,112 682,120" dur="6s" repeatCount="indefinite"/></path>
      </g>
      <ellipse cx="626" cy="96" rx="13" ry="8" fill="#fff" opacity="0.5"/>
    </g>
    <!-- gold collar + neck -->
    <rect x="618" y="152" width="44" height="16" rx="3" fill="url(#gold)"/>
    <rect x="626" y="168" width="28" height="12" fill="#ffffff" opacity="0.35"/>
    <!-- body -->
    <g transform="translate(640,268)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.62 1;1 1;0.62 1;1 1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <rect x="-118" y="-88" width="236" height="190" rx="70" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
        <rect x="-106" y="-40" width="212" height="132" rx="56" fill="url(#liquid)"/>
        <rect x="-118" y="-88" width="236" height="190" rx="70" fill="url(#glass)"/>
        <!-- label slides round the body as it turns -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;-52 0;0 0;52 0;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
          <animate attributeName="opacity" values="1;0.25;1;0.25;1" keyTimes="0;0.25;0.5;0.75;1" dur="12s" repeatCount="indefinite"/>
          <rect x="-46" y="-22" width="92" height="84" fill="#efd9b8" stroke="#8a3a1a" stroke-width="1.5"/>
          <rect x="-40" y="-16" width="80" height="72" fill="none" stroke="#8a3a1a" stroke-width="0.7"/>
          <text x="0" y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="3" fill="#8a3a1a">ÉCORCE</text>
          <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#8a3a1a">Cuir</text>
          <text x="0" y="42" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#8a3a1a">Brûlé</text>
        </g>
      </g>
      <!-- specular sweep -->
      <ellipse cx="-70" cy="-50" rx="10" ry="22" fill="#fff" opacity="0.55">
        <animate attributeName="cx" values="-70;60;-70" dur="12s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- scent mist rising from the cap -->
  <g filter="url(#soft)">
    <circle cx="640" cy="66" r="18" fill="url(#puff)">
      <animate attributeName="cy" values="70;-10" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;46" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="652" cy="66" r="18" fill="url(#puff)">
      <animate attributeName="cy" values="70;-6" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="646;700" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;40" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="628" cy="66" r="18" fill="url(#puff)">
      <animate attributeName="cy" values="70;0" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="634;584" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;38" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark (left) -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f6e9dc">
    <text x="64" y="132" font-size="58" letter-spacing="14">ÉCORCE</text>
    <text x="68" y="170" font-size="24" font-style="italic" fill="#e9c98c">Maison de Parfum</text>
    <text x="68" y="232" font-size="19" fill="#f6e9dc" fill-opacity="0.8">Ten extraits distilled</text>
    <text x="68" y="258" font-size="19" fill="#f6e9dc" fill-opacity="0.8">from bark, resin <tspan font-style="italic" fill="#f08a6a">&amp; skin.</tspan></text>
    <text x="68" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.2" fill="#c9a04e">SCROLL-DRIVEN 3D · NEXT.JS · THREE.JS · GSAP</text>
  </g>

  <!-- live link pill (right) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="882" y="96" width="336" height="58" rx="29" fill="#f6e9dc">
      <animate attributeName="opacity" values="1;0.82;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="912" cy="125" r="6" fill="#b3261e">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="930" y="121" font-size="11" font-weight="700" letter-spacing="3" fill="#6e1a1e">LIVE</text>
    <text x="930" y="141" font-size="17" font-weight="700" fill="#2b1416">perfume-ad-site.vercel.app</text>
    <text x="1218" y="196" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#e9c98c">Press &amp; hold to spray —</text>
    <text x="1218" y="222" text-anchor="end" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#e9c98c">the mist blooms into the site.</text>
  </g>
</svg>
